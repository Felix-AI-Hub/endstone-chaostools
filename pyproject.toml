[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-chaostools"
version = "0.3.0"
description = "Floating texts moved with the crosshair, portals and signs for Endstone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.entry-points.endstone]
chaostools = "endstone_chaostools:ChaosToolsPlugin"

[tool.setuptools]
packages = ["endstone_chaostools"]
