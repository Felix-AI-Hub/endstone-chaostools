[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-chaosportals"
version = "0.5.0"
description = "Portals and signs for Endstone that teleport players or send them to another server"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.entry-points.endstone]
chaosportals = "endstone_chaosportals:ChaosPortalsPlugin"

[tool.setuptools]
packages = ["endstone_chaosportals"]
