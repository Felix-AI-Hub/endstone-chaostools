[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-chaostexts"
version = "0.5.1"
description = "Floating texts for Endstone that you move with your crosshair"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.entry-points.endstone]
chaostexts = "endstone_chaostexts:ChaosTextsPlugin"

[tool.setuptools]
packages = ["endstone_chaostexts"]
